name: Sync Collectr
on:
  schedule:
    - cron: "0 * * * *"   # hourly
  workflow_dispatch:       # lets you run it by hand from the Actions tab
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/sync.mjs
      - run: |
          git config user.name "stockd-bot"
          git config user.email "stockd-bot@users.noreply.github.com"
          git add products.json
          git diff --cached --quiet || (git commit -m "Sync Collectr" && git push)
